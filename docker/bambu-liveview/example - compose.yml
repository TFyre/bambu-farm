services:
    mediamtx:
        # Note: GitHub release tags carry a 'v' prefix (v1.21.2), Docker Hub
        # image tags do not.
        image: bluenviron/mediamtx:1.21.2
        restart: always
        volumes:
            - ./mediamtx.yml:/mediamtx.yml
        # mediamtx.yml is kept as a verbatim copy of upstream's file, so it can
        # be replaced wholesale on a version bump. mediamtx reads MTX_* variables
        # AFTER the yml file, so every local setting goes here instead:
        #   mediamtx.env - server settings (WebRTC address, source transport)
        #   printers.env - one path per printer, generated by build-printers-env.sh
        env_file:
            - mediamtx.env
            - printers.env
        ports:
            #RTSP
            #- '8554:8554'

            #WebRTC
            - '8189:8189/tcp'
            - '8189:8189/udp'
            #- '8888:8888'
            - '8889:8889'

    bambuweb:
        image: azul/zulu-openjdk:21-latest
        restart: always
        volumes:
            - ./bambu-web-X.X.X-runner.jar:/bambu-web-runner.jar
            - ./bambu-web-env.txt:/.env
        ports:
            - '8081:8080'
        entrypoint: /usr/bin/java -Djdk.tls.useExtendedMasterSecret=false -jar bambu-web-runner.jar

    nginx:
        image: nginx:1.26-alpine
        restart: always
        volumes:
            # mounted as a template so nginx substitutes $DOMAIN from the environment
            - ./reverse-proxy.conf:/etc/nginx/templates/default.conf.template
            - ./certbot/conf:/etc/letsencrypt:ro
            - ./certbot/www:/var/www/certbot
        ports:
            #HTTPS
            - '443:443'
            #HTTP (acme challenge + redirect to https)
            - '80:80'
            #Optional LAN access without TLS
            #- '8080:80'
        environment:
            DOMAIN: ${DOMAIN}
            # only substitute $DOMAIN in the template, leave other nginx vars alone
            NGINX_ENVSUBST_FILTER: DOMAIN
        # reload nginx periodically so renewed certificates are picked up.
        #
        # nginx is started THROUGH /docker-entrypoint.sh, not directly. The stock
        # entrypoint only runs /docker-entrypoint.d/ - which is what renders the
        # $DOMAIN template above into /etc/nginx/conf.d/default.conf - when the
        # first argument is literally "nginx":
        #
        #   if [ "$1" = "nginx" ] || [ "$1" = "nginx-debug" ]; then
        #
        # A plain `exec nginx -g "daemon off;"` makes $1 "/bin/sh", so that whole
        # block is skipped, envsubst never runs, and nginx quietly serves its own
        # stock default.conf - no proxy, no /_camerastream/, no TLS. Nothing
        # errors and `nginx -t` still passes.
        command: ['/bin/sh', '-c', '(while :; do sleep 6h; nginx -s reload; done) & exec /docker-entrypoint.sh nginx -g "daemon off;"']
        depends_on:
            - mediamtx
            - bambuweb

    certbot:
        image: certbot/certbot:latest
        restart: always
        volumes:
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
        # renew once a day-ish (12h), webroot challenge served by nginx.
        # the initial certificate must be issued manually, see README
        entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'
        depends_on:
            - nginx

    # Printers are no longer containers. mediamtx pulls each one over RTSPS
    # itself - add them to printers.list and run ./build-printers-env.sh, which
    # writes printers.env. See the README.
