map $http_upgrade $connection_upgrade {
        default upgrade;
        #'' close;
	'' '';
}

upstream mediamtx {
	keepalive 32;
        server mediamtx:8889;
}

upstream bambuweb {
	keepalive 32;
        server bambuweb:8080;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  $DOMAIN;
    access_log off;

    # acme challenge for certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    http2 on;
    server_name  $DOMAIN;
    access_log off;

    ssl_certificate     /etc/letsencrypt/live/$DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # acme challenge for certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location /_camerastream/ {
        rewrite /_camerastream/(.*) /$1  break;
        proxy_redirect / /_camerastream/;
        absolute_redirect off;
        proxy_pass http://mediamtx/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # for websockets
        proxy_read_timeout 5m;
    }

    location / {
        client_max_body_size 20m;
        proxy_pass http://bambuweb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # for websockets
        proxy_read_timeout 5m;
    }

    error_page 404 /404.html;
        location = /40x.html {
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}
